<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Contact Laura Félix — Software Developer.">

    <meta
  name="theme-color"
  content="#060708"
/>

    <!-- Open Graph -->
<meta
  property="og:title"
  content="Projects — Laura Felix"
/>

<meta
  property="og:description"
  content="Selected software projects by Laura Felix."
/>

<meta
  property="og:type"
  content="website"
/>

<meta
  property="og:url"
  content="https://laurafelix.es/projects.html"
/>

  <title>Contact — Laura Felix</title>

   <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="./favicon.png"
  />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Global styles -->
  <link rel="stylesheet" href="./styles.css">

  <!-- Contact styles -->
  <link rel="stylesheet" href="./contact.css">
</head>

<body>

  <!-- =========================================================
       GLOBAL PAGE TRANSITION
       ========================================================= -->

  <div
    id="page-transition"
    class="page-transition"
    aria-hidden="true"
  >

    <div class="page-transition__scan"></div>

    <div class="page-transition__core">
  <div class="page-transition__loader">
    <span class="page-transition__loader-dot"></span>
  </div>
</div>

  </div>

  <!-- =====================================================
       THREE.JS CONTACT SCENE
       ===================================================== -->

  <div
    id="contact-webgl"
    aria-hidden="true"
  ></div>


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="contact-header">

    <a
      class="contact-brand"
      href="./index.html"
      aria-label="Back to home"
    >
      LF
    </a>


    <div class="contact-header-actions">

      <a
        class="back-home"
        href="./index.html"
      >
        ← Home
      </a>


      <a
        class="language-switch"
        href="./contacto-es.html"
      >
        ES
      </a>



    </div>

    <!-- =====================================================
     LANDSCAPE BACK TO HOME
     ===================================================== -->

<a
  class="landscape-back-home"
  href="./index.html"
  aria-label="Back to home"
>
  <span class="landscape-back-home__arrow">←</span>

  <span class="landscape-back-home__text">
    BACK TO HOME
  </span>

  <span class="landscape-back-home__index">
    00
  </span>
</a>


    <!-- MOBILE MENU BUTTON -->
    <button
      class="mobile-menu-toggle"
      type="button"
      aria-label="Open navigation menu"
      aria-controls="mobile-menu"
      aria-expanded="false"
    >

      <span
        class="mobile-menu-toggle__indicator"
        aria-hidden="true"
      ></span>

      <span class="mobile-menu-toggle__text">
        MENU
      </span>

    </button>

  </header>


  <!-- =====================================================
       MOBILE NAVIGATION
       ===================================================== -->

  <nav
    id="mobile-menu"
    class="mobile-menu"
    aria-label="Mobile navigation"
    aria-hidden="true"
  >

    <div
      class="mobile-menu__backdrop"
      data-menu-close
      aria-hidden="true"
    ></div>


    <div
      class="mobile-menu__panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="mobile-menu-title"
    >

      <div class="mobile-menu__header">

        <div>

          <span
            id="mobile-menu-title"
            class="mobile-menu__title"
          >
            LF // NAVIGATION
          </span>

          <span class="mobile-menu__status">

            <span
              class="mobile-menu__status-dot"
              aria-hidden="true"
            ></span>

            ONLINE

          </span>

        </div>


        <button
          class="mobile-menu__close"
          type="button"
          aria-label="Close navigation menu"
          data-menu-close
        >
          ×
        </button>

      </div>


      <div class="mobile-menu__navigation">

        <span class="mobile-menu__label">
          EXPLORE
        </span>


        <a
          class="mobile-menu__link"
          href="./projects.html"
        >
          <span class="mobile-menu__number">01</span>

          <span class="mobile-menu__link-content">

            <span class="mobile-menu__link-title">
              Projects
            </span>

            <span class="mobile-menu__link-description">
              Selected work
            </span>

          </span>

          <span class="mobile-menu__arrow">
            ↗
          </span>
        </a>


        <a
          class="mobile-menu__link"
          href="./technologies.html"
        >
          <span class="mobile-menu__number">02</span>

          <span class="mobile-menu__link-content">

            <span class="mobile-menu__link-title">
              Technologies
            </span>

            <span class="mobile-menu__link-description">
              My technical stack
            </span>

          </span>

          <span class="mobile-menu__arrow">
            ↗
          </span>
        </a>


        <a
          class="mobile-menu__link"
          href="./about.html"
        >
          <span class="mobile-menu__number">03</span>

          <span class="mobile-menu__link-content">

            <span class="mobile-menu__link-title">
              About
            </span>

            <span class="mobile-menu__link-description">
              Developer profile
            </span>

          </span>

          <span class="mobile-menu__arrow">
            ↗
          </span>
        </a>


        <a
          class="mobile-menu__link"
          href="./contact.html"
        >
          <span class="mobile-menu__number">04</span>

          <span class="mobile-menu__link-content">

            <span class="mobile-menu__link-title">
              Contact
            </span>

            <span class="mobile-menu__link-description">
              Start a conversation
            </span>

          </span>

          <span class="mobile-menu__arrow">
            ↗
          </span>
        </a>

      </div>


      <div class="mobile-menu__footer">

        <div class="mobile-menu__footer-row">

          <span class="mobile-menu__footer-label">
            LANGUAGE
          </span>

          <a
            class="mobile-menu__language mobile-menu__language--active"
            href="./contact.html"
          >
            EN
          </a>

          <span class="mobile-menu__language-separator">
            /
          </span>

          <a
            class="mobile-menu__language"
            href="./contacto-es.html"
          >
            ES
          </a>

        </div>




        <div class="mobile-menu__connection">

          <span class="mobile-menu__connection-dot"></span>

          CONNECTION: SECURE

        </div>

      </div>

    </div>

  </nav>


  <!-- =====================================================
       CONTACT PAGE
       ===================================================== -->

  <main class="contact-page">

    <section
      class="contact-section"
      aria-label="Contact"
    >

      <!--

        The actual contact interface is generated
        by contact.js and placed on Cube.004.

        There is intentionally NO external contact
        panel here.

      -->

    </section>

  </main>



  <!-- =====================================================
       THREE.JS IMPORT MAP
       ===================================================== -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>


  <!-- Contact scene -->
  <script
    type="module"
    src="./contact.js"
  ></script>

  <!-- Mobile menu -->
  <script
    type="module"
    src="./mobile-menu.js"
  ></script>

  <script src="./page-transition.js"></script>

</body>

</html>
